<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Karakeep</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #1c1c1e; color: #e5e5e5;
        font-family: "Segoe UI", system-ui, sans-serif;
        gap: 18px;
      }
      .logo { width: 72px; height: 72px; }
      .spinner {
        width: 28px; height: 28px;
        border: 3px solid #3a3a3c; border-top-color: #ffc53d;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      p { margin: 0; font-size: 14px; color: #a1a1a6; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <svg class="logo" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <rect x="64" y="64" width="896" height="896" rx="192" fill="#ffc53d"/>
      <path d="M320 224 h384 a48 48 0 0 1 48 48 v560 l-240 -160 -240 160 v-560 a48 48 0 0 1 48 -48 z" fill="#1c1c1e"/>
    </svg>
    <div class="spinner"></div>
    <p id="status">正在启动 Karakeep…（首次启动需要初始化数据）</p>
  </body>
</html>
