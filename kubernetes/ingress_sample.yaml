apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saiye-web-ingress
  namespace: saiye
spec:
  rules:
  - host: "saiye.example.com"
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: "web"
            port:
              number: 3000
